<div style="color:#94a3b8;">Normal Events</div>
</div>

<div style="background:#111827;padding:20px;border-radius:10px;min-width:150px;">
<div style="font-size:28px;font-weight:bold;" id="anomalyCount">-</div>
<div style="color:#94a3b8;">Anomalies Detected</div>
</div>

</div>

</div>

<!-- SCRIPT (UNCHANGED LOGIC) -->
<script>
async function loadStats() {
    try {
        const response = await fetch('http://localhost:5000/api/logs');
        const logs = await response.json();
        const normal = logs.filter(l => l.is_anomaly !== true).length;
        const anomaly = logs.filter(l => l.is_anomaly === true).length;
        document.getElementById('normalCount').innerText = normal;
        document.getElementById('anomalyCount').innerText = anomaly;
    } catch(e) {
        console.error('Stats error:', e);
        document.getElementById('normalCount').innerText = '0';
        document.getElementById('anomalyCount').innerText = '0';
    }
}
loadStats();
setInterval(loadStats, 5000);
</script>
